    border-radius: 16px; box-shadow: 0 4px 14px var(--shadow);
    transition: transform .15s, box-shadow .15s;
  }
  a:hover, a:focus-visible { transform: translateY(-2px); box-shadow: 0 8px 20px var(--shadow); outline: 2px solid var(--accent); }
  a span:first-child { font-size: 1.4rem; width: 1.6em; }
